<!--
  Diese Seite ist ein WIEDERVERWENDBARES TEMPLATE für alle Bücher.
  Sie liest den Buchtitel aus der URL (z.B. ratgeber-sonntag.html),
  zeigt das passende Bild aus pics/ratgeber und lädt den Text aus der passenden
  .md-Datei   aus md/ratgeber/ nach.

  WICHTIG: Das Nachladen der .md-Datei per fetch() funktioniert nur, wenn die
  Seite über einen lokalen Server läuft (z.B. VS-Code-Erweiterung "Live Server"),
  NICHT wenn du die Datei per Doppelklick öffnest (file://-Adresse). Der Browser
  blockiert das Nachladen lokaler Dateien aus Sicherheitsgründen sonst.
-->

  </section>
</div>
